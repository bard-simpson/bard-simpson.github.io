<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bard Simpson</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#fcfcfd">
  <style>
    @font-face {
      font-family: "Fredoka";
      src:
        url("assets/fonts/Fredoka-Light.woff2") format("woff2"),
        url("assets/fonts/Fredoka-Light.ttf") format("truetype");
      font-weight: 300;
      font-style: normal;
      font-display: swap;
    }

    :root {
      color-scheme: light;
      --bg: #faf8f5;
      --ink: #3d3a35;
      --muted: #8a847a;
      --panel: #fffdf9;
      --line: rgba(61, 58, 53, 0.12);
      --accent: #6f8f7a;
      --accent-soft: rgba(111, 143, 122, 0.14);
      --shadow: 0 18px 50px rgba(61, 58, 53, 0.12);
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --space-ink: #e8eef8;
      --space-bg: #0b1220;
      --space-panel: #121a2b;
      --space-line: rgba(232, 238, 248, 0.12);
      --space-accent: #7aa2ff;
      --space-good: #7dcea0;
      --space-warm: #f0b37a;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--ink);
      font-family: "Fredoka", system-ui, sans-serif;
      font-weight: 300;
      letter-spacing: 0.04em;
      overflow: hidden;
    }

    body.menu-open,
    body.panel-open,
    body.game-open,
    body.hunt-open {
      overflow: hidden;
    }

    button, input {
      font: inherit;
      color: inherit;
    }

    .stage {
      position: relative;
      display: grid;
      justify-items: center;
      gap: 1rem;
      padding: 1.5rem;
    }

    .name-button {
      margin: 0;
      padding: 0.2rem 0.4rem;
      border: 0;
      background: transparent;
      cursor: pointer;
      border-radius: 0.75rem;
      -webkit-tap-highlight-color: transparent;
    }

    .name-button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 6px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.5rem, 8vw, 4.5rem);
      font-weight: 300;
      line-height: 1.1;
      text-align: center;
    }

    h1 .char {
      display: inline-block;
      opacity: 0;
      transform: translateY(0.35em);
      animation: letter-in 0.9s ease forwards;
      animation-delay: calc(var(--i) * 0.16s + 0.2s);
    }

    h1 .space {
      display: inline-block;
      width: 0.35em;
    }

    @keyframes letter-in {
      from {
        opacity: 0;
        transform: translateY(0.35em);
        filter: blur(4px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
      }
    }

    .hint {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
      opacity: 0;
      animation: fade-in 0.8s ease 2.1s forwards;
    }

    @keyframes fade-in { to { opacity: 1; } }

    .menu {
      position: absolute;
      top: calc(100% + 0.35rem);
      left: 50%;
      min-width: min(18rem, 82vw);
      padding: 0.45rem;
      border: 1px solid var(--line);
      border-radius: 1rem;
      background: var(--panel);
      box-shadow: var(--shadow);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translate(-50%, -0.4rem) scale(0.98);
      transition:
        opacity 0.22s ease,
        transform 0.28s var(--ease),
        visibility 0.22s ease;
      z-index: 20;
      display: grid;
      gap: 0.2rem;
    }

    .menu.open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: translate(-50%, 0) scale(1);
    }

    .menu button {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.9rem 1rem;
      border: 0;
      border-radius: 0.75rem;
      background: transparent;
      cursor: pointer;
      text-align: left;
      transition: background 0.18s ease;
    }

    .menu button:hover,
    .menu button:focus-visible {
      background: var(--accent-soft);
      outline: none;
    }

    .menu .label { font-size: 1.05rem; }
    .menu .meta { color: var(--muted); font-size: 0.85rem; }

    .backdrop {
      position: fixed;
      inset: 0;
      background: rgba(61, 58, 53, 0.18);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.28s ease, visibility 0.28s ease;
      z-index: 30;
    }

    .backdrop.open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .panel {
      position: fixed;
      top: 0;
      right: 0;
      width: min(26rem, 100vw);
      height: 100vh;
      height: 100dvh;
      display: grid;
      grid-template-rows: auto auto 1fr;
      background: var(--panel);
      border-left: 1px solid var(--line);
      box-shadow: var(--shadow);
      transform: translateX(105%);
      transition: transform 0.42s var(--ease);
      z-index: 40;
    }

    .panel.open { transform: translateX(0); }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1.25rem 1.25rem 0.75rem;
    }

    .panel-header h2 {
      margin: 0;
      font-size: 1.55rem;
      font-weight: 300;
    }

    .icon-button {
      width: 2.5rem;
      height: 2.5rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: transparent;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: background 0.18s ease;
    }

    .icon-button:hover,
    .icon-button:focus-visible {
      background: var(--accent-soft);
      outline: none;
    }

    .todo-form {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.6rem;
      padding: 0.75rem 1.25rem 1rem;
      border-bottom: 1px solid var(--line);
    }

    .todo-form input {
      width: 100%;
      padding: 0.85rem 1rem;
      border: 1px solid var(--line);
      border-radius: 0.9rem;
      background: #fff;
      outline: none;
    }

    .todo-form input:focus {
      border-color: rgba(111, 143, 122, 0.55);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .todo-form button {
      padding: 0.85rem 1.1rem;
      border: 0;
      border-radius: 0.9rem;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      white-space: nowrap;
    }

    .todo-list {
      list-style: none;
      margin: 0;
      padding: 0.85rem 1rem 1.5rem;
      overflow: auto;
    }

    .todo-item {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 0.75rem;
      align-items: center;
      padding: 0.85rem 0.7rem;
      border-bottom: 1px solid var(--line);
    }

    .todo-item:last-child { border-bottom: 0; }

    .todo-item input[type="checkbox"] {
      width: 1.15rem;
      height: 1.15rem;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .todo-item span {
      overflow-wrap: anywhere;
      line-height: 1.35;
    }

    .todo-item.done span {
      color: var(--muted);
      text-decoration: line-through;
    }

    .todo-item .remove {
      border: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      padding: 0.35rem 0.5rem;
      border-radius: 0.5rem;
    }

    .todo-item .remove:hover,
    .todo-item .remove:focus-visible {
      background: rgba(61, 58, 53, 0.06);
      color: var(--ink);
      outline: none;
    }

    .empty {
      margin: 1.5rem 0.5rem;
      color: var(--muted);
      text-align: center;
      line-height: 1.5;
    }

    /* ===== Terrafab game overlay ===== */
    .game-overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: var(--space-bg);
      color: var(--space-ink);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translateY(1.25rem);
      transition:
        opacity 0.32s ease,
        transform 0.42s var(--ease),
        visibility 0.32s ease;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
    }

    .game-overlay.open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: translateY(0);
    }

    .tf-shell {
      width: min(980px, 100%);
      margin: 0 auto;
      padding: 1rem 1rem 2.5rem;
      display: grid;
      gap: 1rem;
    }

    .tf-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
      position: sticky;
      top: 0;
      z-index: 5;
      padding: 0.4rem 0 0.6rem;
      background: linear-gradient(to bottom, rgba(11,18,32,0.98), rgba(11,18,32,0.88) 70%, transparent);
    }

    .tf-kicker {
      margin: 0 0 0.2rem;
      color: var(--space-accent);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-size: 0.75rem;
    }

    .tf-top h2 {
      margin: 0;
      font-weight: 300;
      font-size: clamp(1.35rem, 4vw, 1.9rem);
    }

    .tf-close {
      width: 2.5rem;
      height: 2.5rem;
      border-radius: 999px;
      border: 1px solid var(--space-line);
      background: rgba(255,255,255,0.03);
      color: var(--space-ink);
      cursor: pointer;
    }

    .tf-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.6rem;
    }

    .tf-stats > div {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--space-line);
      border-radius: 1rem;
      padding: 0.8rem 0.9rem;
    }

    .tf-label {
      display: block;
      color: rgba(232,238,248,0.55);
      font-size: 0.78rem;
      margin-bottom: 0.25rem;
    }

    .tf-stats strong {
      font-size: 1.15rem;
      font-weight: 300;
    }

    .tf-stage {
      position: relative;
      min-height: 280px;
      border-radius: 1.4rem;
      border: 1px solid var(--space-line);
      background:
        radial-gradient(circle at 50% 120%, rgba(122,162,255,0.18), transparent 40%),
        linear-gradient(180deg, #10192c, #0a101c 70%);
      overflow: hidden;
      display: grid;
      place-items: center;
      padding: 1.5rem 1rem 2rem;
    }

    .tf-sky {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .tf-stars {
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,0.8), transparent),
        radial-gradient(1px 1px at 30% 70%, rgba(255,255,255,0.55), transparent),
        radial-gradient(1.5px 1.5px at 70% 30%, rgba(255,255,255,0.7), transparent),
        radial-gradient(1px 1px at 85% 60%, rgba(255,255,255,0.5), transparent),
        radial-gradient(1px 1px at 45% 15%, rgba(255,255,255,0.65), transparent),
        radial-gradient(1px 1px at 60% 80%, rgba(255,255,255,0.45), transparent);
      animation: tf-twinkle 6s ease-in-out infinite alternate;
      opacity: 0.85;
    }

    @keyframes tf-twinkle {
      from { opacity: 0.55; }
      to { opacity: 0.95; }
    }

    .tf-earth {
      position: absolute;
      left: 50%;
      bottom: -42%;
      width: 140%;
      height: 70%;
      transform: translateX(-50%);
      border-radius: 50%;
      background:
        radial-gradient(circle at 50% 30%, rgba(125,206,160,0.25), transparent 30%),
        radial-gradient(circle at 50% 0%, #1b3a5f, #0b1524 60%);
      border-top: 1px solid rgba(122,162,255,0.25);
      box-shadow: 0 -20px 60px rgba(122,162,255,0.12);
    }

    .tf-sat {
      position: absolute;
      top: 18%;
      right: 14%;
      width: 18px;
      height: 10px;
      background: #d9e4ff;
      border-radius: 2px;
      box-shadow: -14px 0 0 -2px #7aa2ff, 14px 0 0 -2px #7aa2ff;
      animation: tf-sat 12s linear infinite;
      opacity: 0.85;
    }

    @keyframes tf-sat {
      from { transform: translateX(0); }
      to { transform: translateX(-40px) translateY(8px); }
    }

    .tf-rocket {
      position: absolute;
      left: 18%;
      bottom: 12%;
      width: 10px;
      height: 28px;
      background: #f4f7ff;
      border-radius: 4px 4px 2px 2px;
      opacity: 0;
      transform: translateY(20px);
    }

    .tf-rocket::before {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -10px;
      width: 6px;
      height: 12px;
      transform: translateX(-50%);
      background: linear-gradient(#f0b37a, transparent);
      border-radius: 0 0 4px 4px;
    }

    .tf-rocket.fly {
      animation: tf-launch 1.7s var(--ease) forwards;
    }

    @keyframes tf-launch {
      0% { opacity: 0; transform: translateY(24px) scale(0.9); }
      15% { opacity: 1; }
      100% { opacity: 0; transform: translateY(-220px) scale(1.05); }
    }

    .tf-wafer {
      position: relative;
      z-index: 2;
      width: min(190px, 56vw);
      height: min(190px, 56vw);
      border: 0;
      border-radius: 50%;
      cursor: pointer;
      background:
        radial-gradient(circle at 35% 30%, rgba(255,255,255,0.35), transparent 28%),
        radial-gradient(circle at 50% 50%, #d7dee8, #9aa7b8 62%, #7d8897 100%);
      box-shadow:
        0 18px 40px rgba(0,0,0,0.35),
        inset 0 0 0 8px rgba(255,255,255,0.08);
      color: #1b2433;
      display: grid;
      place-items: center;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      user-select: none;
    }

    .tf-wafer.pulse {
      animation: tf-pulse 0.28s ease;
    }

    @keyframes tf-pulse {
      0% { transform: scale(1); }
      40% { transform: scale(0.96); }
      100% { transform: scale(1); }
    }

    .tf-wafer-ring {
      position: absolute;
      inset: 10%;
      border: 1px dashed rgba(27,36,51,0.18);
      border-radius: 50%;
    }

    .tf-wafer-core {
      width: 42%;
      height: 42%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
    }

    .tf-die {
      background: rgba(27,36,51,0.18);
      border-radius: 3px;
    }

    .tf-wafer-label {
      position: absolute;
      bottom: 16%;
      font-size: 0.85rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(27,36,51,0.72);
    }

    .tf-log {
      position: absolute;
      left: 1rem;
      right: 1rem;
      bottom: 0.85rem;
      z-index: 2;
      margin: 0;
      text-align: center;
      color: rgba(232,238,248,0.7);
      font-size: 0.92rem;
      min-height: 1.3em;
    }

    .tf-floats {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 3;
    }

    .tf-float {
      position: absolute;
      color: var(--space-good);
      font-size: 1rem;
      animation: tf-float 0.9s ease forwards;
      text-shadow: 0 2px 8px rgba(0,0,0,0.35);
      transform: translate(-50%, -50%);
    }

    @keyframes tf-float {
      from { opacity: 0; transform: translate(-50%, -30%) scale(0.9); }
      20% { opacity: 1; }
      to { opacity: 0; transform: translate(-50%, -110%) scale(1.05); }
    }

    .tf-shop {
      display: grid;
      gap: 0.75rem;
    }

    .tf-shop-head h3 {
      margin: 0 0 0.2rem;
      font-weight: 300;
      font-size: 1.25rem;
    }

    .tf-shop-head p {
      margin: 0;
      color: rgba(232,238,248,0.55);
    }

    .tf-buildings,
    .tf-click-up {
      display: grid;
      gap: 0.55rem;
    }

    .tf-card {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 0.85rem;
      align-items: center;
      width: 100%;
      text-align: left;
      padding: 0.85rem 0.95rem;
      border-radius: 1rem;
      border: 1px solid var(--space-line);
      background: rgba(255,255,255,0.03);
      color: var(--space-ink);
      cursor: pointer;
      transition: border-color 0.15s ease, background 0.15s ease, opacity 0.15s ease;
    }

    .tf-card:hover,
    .tf-card:focus-visible {
      border-color: rgba(122,162,255,0.45);
      background: rgba(122,162,255,0.08);
      outline: none;
    }

    .tf-card.locked {
      opacity: 0.48;
    }

    .tf-card.owned {
      cursor: default;
    }

    .tf-card-main {
      display: grid;
      gap: 0.15rem;
    }

    .tf-card-main strong {
      font-weight: 300;
      font-size: 1.05rem;
    }

    .tf-card-main span {
      color: rgba(232,238,248,0.62);
      font-size: 0.9rem;
      line-height: 1.35;
    }

    .tf-meta {
      color: rgba(232,238,248,0.45) !important;
      font-size: 0.82rem !important;
    }

    .tf-glyph {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      border: 1px solid var(--space-line);
      background: rgba(255,255,255,0.04);
      position: relative;
      flex: 0 0 auto;
    }

    .tf-glyph::before,
    .tf-glyph::after {
      content: "";
      position: absolute;
      inset: 0;
      margin: auto;
    }

    .tf-glyph.click::before {
      width: 14px;
      height: 14px;
      border: 2px solid var(--space-accent);
      border-radius: 50%;
    }
    .tf-glyph.click::after {
      width: 2px;
      height: 12px;
      top: 22px;
      background: var(--space-accent);
      border-radius: 2px;
    }

    .tf-glyph.tech::before {
      width: 18px;
      height: 22px;
      border: 2px solid #b7c4da;
      border-radius: 4px 4px 8px 8px;
    }

    .tf-glyph.euv::before {
      width: 20px;
      height: 8px;
      background: linear-gradient(90deg, transparent, #7aa2ff, transparent);
      border-radius: 4px;
    }
    .tf-glyph.euv::after {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f0b37a;
      box-shadow: 0 0 10px #f0b37a;
    }

    .tf-glyph.pack::before {
      width: 18px;
      height: 14px;
      border: 2px solid #7dcea0;
      border-radius: 3px;
    }
    .tf-glyph.pack::after {
      width: 8px;
      height: 8px;
      border: 2px solid #7dcea0;
      top: 8px;
    }

    .tf-glyph.pad::before {
      width: 4px;
      height: 22px;
      background: #f4f7ff;
      border-radius: 2px;
    }
    .tf-glyph.pad::after {
      width: 16px;
      height: 4px;
      bottom: 10px;
      top: auto;
      background: #f0b37a;
      border-radius: 2px;
    }

    .tf-glyph.link::before {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #7aa2ff;
      box-shadow: 14px -6px 0 #7aa2ff, 8px 10px 0 #7aa2ff;
    }

    .tf-glyph.orbit::before {
      width: 22px;
      height: 22px;
      border: 2px solid rgba(122,162,255,0.7);
      border-radius: 50%;
    }
    .tf-glyph.orbit::after {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #f4f7ff;
      top: 8px;
      left: 22px;
      right: auto;
      bottom: auto;
      margin: 0;
    }

    .tf-glyph.lunar::before {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #d9e0ec;
      box-shadow: inset -4px -2px 0 rgba(0,0,0,0.15);
    }

    .tf-prestige-card {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 1rem;
      align-items: center;
      padding: 1rem;
      border-radius: 1rem;
      border: 1px solid rgba(240,179,122,0.28);
      background: rgba(240,179,122,0.06);
    }

    .tf-prestige-card strong {
      display: block;
      font-weight: 300;
      font-size: 1.1rem;
      margin-bottom: 0.25rem;
    }

    .tf-prestige-card p {
      margin: 0 0 0.35rem;
      color: rgba(232,238,248,0.7);
      line-height: 1.4;
    }

    .tf-launch {
      padding: 0.85rem 1.1rem;
      border: 0;
      border-radius: 0.9rem;
      background: linear-gradient(180deg, #f6c48b, #e0924d);
      color: #24170c;
      cursor: pointer;
      white-space: nowrap;
    }

    .tf-launch.locked,
    .tf-launch:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .tf-reset {
      justify-self: start;
      margin-top: 0.25rem;
      border: 0;
      background: transparent;
      color: rgba(232,238,248,0.4);
      cursor: pointer;
      padding: 0.4rem 0;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    @media (max-width: 640px) {
      .tf-stats {
        grid-template-columns: 1fr;
      }
      .tf-prestige-card {
        grid-template-columns: 1fr;
      }
      .tf-launch {
        width: 100%;
      }
    }


    /* ===== Terrafab Hunt ===== */
    .hunt-overlay {
      position: fixed;
      inset: 0;
      z-index: 55;
      background: #0a101c;
      color: var(--space-ink);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translateY(1.1rem);
      transition:
        opacity 0.32s ease,
        transform 0.42s var(--ease),
        visibility 0.32s ease;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
    }

    .hunt-overlay.open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: translateY(0);
    }

    .th-shell {
      width: min(720px, 100%);
      margin: 0 auto;
      padding: 1rem 1rem 2.5rem;
      display: grid;
      gap: 0.9rem;
    }

    .th-top {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      align-items: flex-start;
      position: sticky;
      top: 0;
      z-index: 3;
      padding: 0.35rem 0 0.5rem;
      background: linear-gradient(to bottom, rgba(10,16,28,0.98), rgba(10,16,28,0.88) 72%, transparent);
    }

    .th-kicker {
      margin: 0 0 0.15rem;
      color: #f0b37a;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-size: 0.72rem;
    }

    .th-top h2 {
      margin: 0;
      font-weight: 300;
      font-size: clamp(1.3rem, 4vw, 1.8rem);
    }

    .th-blurb {
      margin: 0.25rem 0 0;
      color: rgba(232,238,248,0.58);
      font-size: 0.95rem;
    }

    .th-close {
      width: 2.5rem;
      height: 2.5rem;
      border-radius: 999px;
      border: 1px solid var(--space-line);
      background: rgba(255,255,255,0.03);
      color: var(--space-ink);
      cursor: pointer;
    }

    .th-hud {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.55rem;
    }

    .th-hud > div {
      border: 1px solid var(--space-line);
      background: rgba(255,255,255,0.03);
      border-radius: 0.9rem;
      padding: 0.7rem 0.8rem;
    }

    .th-hud span {
      display: block;
      color: rgba(232,238,248,0.5);
      font-size: 0.75rem;
      margin-bottom: 0.2rem;
    }

    .th-hud strong {
      font-weight: 300;
      font-size: 1.05rem;
    }

    .th-board-wrap {
      border: 1px solid var(--space-line);
      border-radius: 1.25rem;
      background:
        radial-gradient(circle at 50% 0%, rgba(122,162,255,0.12), transparent 45%),
        linear-gradient(180deg, #121a2b, #0b1220);
      padding: 1rem 0.85rem 0.9rem;
    }

    .th-board {
      --th-cols: 8;
      --th-rows: 8;
      width: min(100%, 420px);
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(var(--th-cols), 1fr);
      gap: 3px;
      aspect-ratio: var(--th-cols) / var(--th-rows);
    }

    .th-cell {
      border-radius: 4px;
      background: var(--c);
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.12);
      transition: transform 0.15s ease, opacity 0.15s ease, filter 0.15s ease;
    }

    .th-cell.empty {
      background: rgba(255,255,255,0.035);
      box-shadow: none;
    }

    .th-cell.buried {
      filter: brightness(0.72) saturate(0.85);
    }

    .th-cell.exposed {
      filter: brightness(1.08);
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,0.18),
        0 0 0 1px rgba(255,255,255,0.05);
    }

    .th-cell.flash {
      transform: scale(0.72);
      opacity: 0.2;
    }

    .th-msg {
      margin: 0.8rem 0 0;
      min-height: 1.35em;
      text-align: center;
      color: rgba(232,238,248,0.7);
      font-size: 0.95rem;
    }

    .th-section-label {
      margin: 0 0 0.45rem;
      color: rgba(232,238,248,0.5);
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .th-docks {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(7rem, 1fr));
      gap: 0.5rem;
    }

    .th-dock {
      border-radius: 0.9rem;
      border: 1px solid var(--space-line);
      background: rgba(255,255,255,0.03);
      padding: 0.7rem 0.75rem;
      display: grid;
      gap: 0.25rem;
      min-height: 4.4rem;
    }

    .th-dock strong {
      width: 1.35rem;
      height: 1.35rem;
      border-radius: 0.35rem;
      background: var(--c);
      display: block;
    }

    .th-dock span {
      font-size: 0.8rem;
      color: rgba(232,238,248,0.55);
    }

    .th-dock em {
      font-style: normal;
      font-size: 0.82rem;
      color: rgba(232,238,248,0.78);
    }

    .th-dock.empty {
      border-style: dashed;
      opacity: 0.75;
    }

    .th-dock.active {
      border-color: rgba(125,206,160,0.45);
      background: rgba(125,206,160,0.08);
    }

    .th-dock.stuck {
      border-color: rgba(255,123,114,0.4);
      background: rgba(255,123,114,0.08);
    }

    .th-tray {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(7.2rem, 1fr));
      gap: 0.5rem;
    }

    .th-color-btn {
      border: 1px solid var(--space-line);
      background: rgba(255,255,255,0.03);
      color: var(--space-ink);
      border-radius: 0.95rem;
      padding: 0.8rem 0.75rem;
      cursor: pointer;
      display: grid;
      justify-items: start;
      gap: 0.25rem;
      text-align: left;
      transition: border-color 0.15s ease, background 0.15s ease, transform 0.12s ease;
    }

    .th-color-btn i {
      width: 1.4rem;
      height: 1.4rem;
      border-radius: 0.4rem;
      background: var(--c);
      display: block;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.08);
    }

    .th-color-btn span {
      font-size: 0.95rem;
    }

    .th-color-btn em {
      font-style: normal;
      color: rgba(232,238,248,0.5);
      font-size: 0.8rem;
    }

    .th-color-btn:hover,
    .th-color-btn:focus-visible {
      border-color: rgba(122,162,255,0.5);
      background: rgba(122,162,255,0.08);
      outline: none;
    }

    .th-color-btn:active {
      transform: scale(0.98);
    }

    .th-color-btn.next {
      justify-items: center;
      text-align: center;
      background: linear-gradient(180deg, rgba(122,162,255,0.25), rgba(122,162,255,0.08));
      border-color: rgba(122,162,255,0.45);
      min-height: 3.4rem;
      place-items: center;
      font-size: 1.05rem;
    }

    .th-tray-empty {
      color: rgba(232,238,248,0.5);
      padding: 0.6rem 0.2rem;
    }

    .th-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .th-btn {
      border: 1px solid var(--space-line);
      background: rgba(255,255,255,0.05);
      color: var(--space-ink);
      border-radius: 999px;
      padding: 0.65rem 1rem;
      cursor: pointer;
    }

    .th-btn.ghost {
      background: transparent;
      color: rgba(232,238,248,0.7);
    }

    .th-btn:hover,
    .th-btn:focus-visible {
      border-color: rgba(122,162,255,0.45);
      outline: none;
    }

    .th-help {
      margin: 0;
      color: rgba(232,238,248,0.42);
      font-size: 0.88rem;
      line-height: 1.45;
    }

    .th-help em {
      font-style: normal;
      color: rgba(232,238,248,0.7);
    }

    .hunt-overlay[data-status="won"] .th-msg {
      color: var(--space-good);
    }

    .hunt-overlay[data-status="lost"] .th-msg {
      color: #ff9b94;
    }

    @media (max-width: 640px) {
      .th-hud { grid-template-columns: 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
      h1 .char {
        opacity: 1;
        transform: none;
        filter: none;
        animation: none;
      }

      .hint,
      .menu,
      .backdrop,
      .panel,
      .game-overlay,
      .hunt-overlay,
      .tf-stars,
      .tf-sat,
      .tf-rocket,
      .tf-wafer,
      .tf-float {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="stage">
    <button
      class="name-button"
      id="nameButton"
      type="button"
      aria-haspopup="menu"
      aria-expanded="false"
      aria-controls="mainMenu"
    >
      <h1 aria-label="Bard Simpson">
        <span class="char" style="--i:0">B</span><span class="char" style="--i:1">a</span><span class="char" style="--i:2">r</span><span class="char" style="--i:3">d</span><span class="space" aria-hidden="true"></span><span class="char" style="--i:4">S</span><span class="char" style="--i:5">i</span><span class="char" style="--i:6">m</span><span class="char" style="--i:7">p</span><span class="char" style="--i:8">s</span><span class="char" style="--i:9">o</span><span class="char" style="--i:10">n</span>
      </h1>
    </button>

    <p class="hint">Tap the name</p>

    <div class="menu" id="mainMenu" role="menu" hidden>
      <button type="button" role="menuitem" id="openTodo">
        <span class="label">Todo list</span>
        <span class="meta">Open</span>
      </button>
      <button type="button" role="menuitem" id="openGame">
        <span class="label">Terrafab Idle</span>
        <span class="meta">Play</span>
      </button>
      <button type="button" role="menuitem" id="openHunt">
        <span class="label">Terrafab Hunt</span>
        <span class="meta">Puzzle</span>
      </button>
    </div>
  </div>

  <div class="backdrop" id="backdrop" hidden></div>

  <aside
    class="panel"
    id="todoPanel"
    role="dialog"
    aria-modal="true"
    aria-labelledby="todoTitle"
    hidden
  >
    <div class="panel-header">
      <h2 id="todoTitle">Todo list</h2>
      <button class="icon-button" id="closeTodo" type="button" aria-label="Close todo list">
        ✕
      </button>
    </div>

    <form class="todo-form" id="todoForm">
      <input
        id="todoInput"
        type="text"
        name="todo"
        placeholder="Add something to do"
        autocomplete="off"
        maxlength="200"
      >
      <button type="submit">Add</button>
    </form>

    <ul class="todo-list" id="todoList" aria-live="polite"></ul>
  </aside>

  <div
    class="game-overlay"
    id="gameOverlay"
    role="dialog"
    aria-modal="true"
    aria-label="Terrafab Idle"
    hidden
  ></div>

  <div
    class="hunt-overlay"
    id="huntOverlay"
    role="dialog"
    aria-modal="true"
    aria-label="Terrafab Hunt"
    hidden
  ></div>

  <script src="assets/js/terrafab.js"></script>
  <script src="assets/js/terrafab-hunt.js"></script>
  <script>
    (function () {
      const storageKey = "bard-simpson-todos";
      const nameButton = document.getElementById("nameButton");
      const mainMenu = document.getElementById("mainMenu");
      const openTodo = document.getElementById("openTodo");
      const openGame = document.getElementById("openGame");
      const openHunt = document.getElementById("openHunt");
      const closeTodo = document.getElementById("closeTodo");
      const backdrop = document.getElementById("backdrop");
      const todoPanel = document.getElementById("todoPanel");
      const todoForm = document.getElementById("todoForm");
      const todoInput = document.getElementById("todoInput");
      const todoList = document.getElementById("todoList");
      const gameOverlay = document.getElementById("gameOverlay");
      const huntOverlay = document.getElementById("huntOverlay");

      let todos = loadTodos();
      let gameHandle = null;
      let huntHandle = null;

      function loadTodos() {
        try {
          const raw = localStorage.getItem(storageKey);
          const parsed = raw ? JSON.parse(raw) : [];
          return Array.isArray(parsed) ? parsed : [];
        } catch (error) {
          return [];
        }
      }

      function saveTodos() {
        localStorage.setItem(storageKey, JSON.stringify(todos));
      }

      function renderTodos() {
        todoList.innerHTML = "";

        if (!todos.length) {
          const empty = document.createElement("li");
          empty.className = "empty";
          empty.textContent = "Nothing here yet. Add your first task.";
          todoList.appendChild(empty);
          return;
        }

        todos.forEach((todo) => {
          const item = document.createElement("li");
          item.className = "todo-item" + (todo.done ? " done" : "");
          item.dataset.id = todo.id;

          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.checked = Boolean(todo.done);
          checkbox.setAttribute("aria-label", "Mark done");

          const label = document.createElement("span");
          label.textContent = todo.text;

          const remove = document.createElement("button");
          remove.type = "button";
          remove.className = "remove";
          remove.setAttribute("aria-label", "Remove task");
          remove.textContent = "Remove";

          checkbox.addEventListener("change", () => {
            todo.done = checkbox.checked;
            saveTodos();
            renderTodos();
          });

          remove.addEventListener("click", () => {
            todos = todos.filter((entry) => entry.id !== todo.id);
            saveTodos();
            renderTodos();
          });

          item.append(checkbox, label, remove);
          todoList.appendChild(item);
        });
      }

      function openMenu() {
        mainMenu.hidden = false;
        requestAnimationFrame(() => {
          mainMenu.classList.add("open");
        });
        nameButton.setAttribute("aria-expanded", "true");
        document.body.classList.add("menu-open");
      }

      function closeMenu() {
        mainMenu.classList.remove("open");
        nameButton.setAttribute("aria-expanded", "false");
        document.body.classList.remove("menu-open");
        window.setTimeout(() => {
          if (!mainMenu.classList.contains("open")) {
            mainMenu.hidden = true;
          }
        }, 220);
      }

      function toggleMenu() {
        if (mainMenu.classList.contains("open")) closeMenu();
        else openMenu();
      }

      function openTodoPanel() {
        closeMenu();
        todoPanel.hidden = false;
        backdrop.hidden = false;
        requestAnimationFrame(() => {
          todoPanel.classList.add("open");
          backdrop.classList.add("open");
        });
        document.body.classList.add("panel-open");
        window.setTimeout(() => todoInput.focus(), 280);
      }

      function closeTodoPanel() {
        todoPanel.classList.remove("open");
        backdrop.classList.remove("open");
        document.body.classList.remove("panel-open");
        window.setTimeout(() => {
          if (!todoPanel.classList.contains("open")) {
            todoPanel.hidden = true;
            backdrop.hidden = true;
          }
        }, 420);
        nameButton.focus();
      }

      function openGamePanel() {
        closeMenu();
        if (todoPanel.classList.contains("open")) closeTodoPanel();
        if (huntOverlay.classList.contains("open")) closeHuntPanel();
        gameOverlay.hidden = false;
        document.body.classList.add("game-open");
        requestAnimationFrame(() => {
          gameOverlay.classList.add("open");
        });
        if (gameHandle) {
          gameHandle.stop();
          gameHandle = null;
        }
        gameHandle = window.TerrafabIdle.createGame(gameOverlay);
        if (gameHandle && gameHandle.closeButton) {
          gameHandle.closeButton.addEventListener("click", closeGamePanel, { once: true });
        }
      }

      function closeGamePanel() {
        if (gameHandle) {
          gameHandle.stop();
          gameHandle = null;
        }
        gameOverlay.classList.remove("open");
        document.body.classList.remove("game-open");
        window.setTimeout(() => {
          if (!gameOverlay.classList.contains("open")) {
            gameOverlay.hidden = true;
            gameOverlay.innerHTML = "";
          }
        }, 420);
        nameButton.focus();
      }

      function openHuntPanel() {
        closeMenu();
        if (todoPanel.classList.contains("open")) closeTodoPanel();
        if (gameOverlay.classList.contains("open")) closeGamePanel();
        huntOverlay.hidden = false;
        document.body.classList.add("hunt-open");
        requestAnimationFrame(() => {
          huntOverlay.classList.add("open");
        });
        if (huntHandle) {
          huntHandle.stop();
          huntHandle = null;
        }
        huntHandle = window.TerrafabHunt.createGame(huntOverlay);
        if (huntHandle && huntHandle.closeButton) {
          huntHandle.closeButton.addEventListener("click", closeHuntPanel, { once: true });
        }
      }

      function closeHuntPanel() {
        if (huntHandle) {
          huntHandle.stop();
          huntHandle = null;
        }
        huntOverlay.classList.remove("open");
        document.body.classList.remove("hunt-open");
        window.setTimeout(() => {
          if (!huntOverlay.classList.contains("open")) {
            huntOverlay.hidden = true;
            huntOverlay.innerHTML = "";
          }
        }, 420);
        nameButton.focus();
      }

      nameButton.addEventListener("click", (event) => {
        event.stopPropagation();
        toggleMenu();
      });

      openTodo.addEventListener("click", (event) => {
        event.stopPropagation();
        openTodoPanel();
      });

      openGame.addEventListener("click", (event) => {
        event.stopPropagation();
        openGamePanel();
      });

      openHunt.addEventListener("click", (event) => {
        event.stopPropagation();
        openHuntPanel();
      });

      closeTodo.addEventListener("click", closeTodoPanel);
      backdrop.addEventListener("click", closeTodoPanel);

      document.addEventListener("click", (event) => {
        if (!mainMenu.classList.contains("open")) return;
        if (mainMenu.contains(event.target) || nameButton.contains(event.target)) return;
        closeMenu();
      });

      document.addEventListener("keydown", (event) => {
        if (event.key !== "Escape") return;
        if (huntOverlay.classList.contains("open")) {
          closeHuntPanel();
          return;
        }
        if (gameOverlay.classList.contains("open")) {
          closeGamePanel();
          return;
        }
        if (todoPanel.classList.contains("open")) {
          closeTodoPanel();
          return;
        }
        if (mainMenu.classList.contains("open")) closeMenu();
      });

      todoForm.addEventListener("submit", (event) => {
        event.preventDefault();
        const text = todoInput.value.trim();
        if (!text) return;

        todos.unshift({
          id: String(Date.now()) + "-" + Math.random().toString(16).slice(2),
          text,
          done: false
        });
        todoInput.value = "";
        saveTodos();
        renderTodos();
        todoInput.focus();
      });

      renderTodos();
    })();
  </script>
</body>
</html>
